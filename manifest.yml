---
# Replace <OWNER> with your GitHub username and <CF_DOMAIN> with your CF apps domain
# e.g. cfapps.eu10.hana.ondemand.com
applications:
  - name: nextjs-sap-btp-backend
    docker:
      image: ghcr.io/<OWNER>/nextjs-sap-btp-backend:latest
    memory: 256M
    disk_quota: 512M
    services:
      - cap-uaa

  - name: nextjs-sap-btp-app
    docker:
      image: ghcr.io/<OWNER>/nextjs-sap-btp-app:latest
    memory: 512M
    disk_quota: 1024M
    services:
      - cap-uaa

  - name: nextjs-sap-btp-approuter
    docker:
      image: ghcr.io/<OWNER>/nextjs-sap-btp-approuter:latest
    memory: 128M
    disk_quota: 256M
    services:
      - cap-uaa
    env:
      destinations: >
        [
          {"name":"backend","url":"https://nextjs-sap-btp-backend.<CF_DOMAIN>","forwardAuthToken":true},
          {"name":"app","url":"https://nextjs-sap-btp-app.<CF_DOMAIN>","forwardAuthToken":true}
        ]
